name: 광제보드 Windows 설치파일 만들기

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 설치 도구 준비
        run: npm install --no-audit --no-fund

      - name: Windows 설치파일 만들기
        run: npm run dist

      - name: 설치파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: GwangjeBoard-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
